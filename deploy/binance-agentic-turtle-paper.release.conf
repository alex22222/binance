[Service]
# Install a dedicated copy of the runtime dependency closure at this exact path.
# Absolute state/config paths keep the existing Paper ledger outside the release.
WorkingDirectory=/opt/binance-agentic-stock-bot/releases/turtle-paper-accounting-20261017
Environment=BOT_CONFIG=/opt/binance-agentic-stock-bot/config.json
Environment=TURTLE_PAPER_STATE=/opt/binance-agentic-stock-bot/state/turtle-paper/latest.json
Environment=TURTLE_PAPER_EVENTS=/opt/binance-agentic-stock-bot/state/turtle-paper/events.jsonl
ExecStartPre=/usr/bin/sha256sum --check --status /opt/binance-agentic-stock-bot/releases/turtle-paper-accounting-20261017/manifest.sha256
ExecStart=
ExecStart=/usr/bin/node /opt/binance-agentic-stock-bot/releases/turtle-paper-accounting-20261017/scripts/run-turtle-paper.mjs
