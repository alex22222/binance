[Service]
WorkingDirectory=/opt/binance-agentic-validation/current
Environment=BOT_CONFIG=/opt/binance-agentic-stock-bot/config.json
Environment=STRATEGY_VALIDATION_DIR=/opt/binance-agentic-stock-bot/state/strategy-validation
ExecStartPre=/usr/bin/node --preserve-symlinks-main /opt/binance-agentic-validation/current/scripts/verify-research-release.mjs
ExecStart=
ExecStart=/usr/bin/node --max-old-space-size=384 /opt/binance-agentic-validation/current/scripts/run-strategy-validation.mjs
ReadWritePaths=
ReadWritePaths=/opt/binance-agentic-stock-bot/state/strategy-validation
InaccessiblePaths=/etc/binance-agentic-stock-bot.env /var/lib/binance-agentic-stock-bot/.baw
CPUQuota=25%
MemoryHigh=384M
MemoryMax=512M
TimeoutStartSec=1800
